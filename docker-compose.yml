version: "2.1"

services:
  k3s:
    # https://docs.k3s.io/advanced#running-k3s-in-docker
    build: k3s
    privileged: true
    network_mode: host
    labels:
      io.balena.features.kernel-modules: "1"
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    tmpfs:
      - /run
      - /var/run
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      # Node password; the server rejects a node that re-registers without it.
      # https://docs.k3s.io/architecture#node-password-secrets
      - k3s-node:/etc/rancher/node
      # The rancher/k3s image declares these as VOLUMEs. Name them, or every
      # recreated container leaves anonymous volumes behind.
      - k3s-kubelet:/var/lib/kubelet
      - k3s-cni:/var/lib/cni
      - k3s-log:/var/log

volumes:
  k3s-data: {}
  k3s-node: {}
  k3s-kubelet: {}
  k3s-cni: {}
  k3s-log: {}
